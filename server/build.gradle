plugins {
    id 'java'
    id 'io.quarkus' version '3.20.0'
    id 'com.diffplug.spotless' version '7.0.2'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:3.20.0")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-redis-client'
    implementation 'io.quarkus:quarkus-messaging-rabbitmq'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
    implementation 'io.quarkus:quarkus-opentelemetry'
    implementation 'io.quarkus:quarkus-logging-json'
    implementation 'io.quarkus:quarkus-smallrye-jwt-build'
    implementation 'io.quarkus:quarkus-elytron-security-common'
    implementation 'io.quarkus:quarkus-security'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-quartz'
    implementation 'io.quarkus:quarkus-mailer'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.43.0'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    java {
        palantirJavaFormat()
        target 'src/**/*.java'
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
}

tasks.named('check') {
    dependsOn 'spotlessCheck'
}

tasks.named('processResources') {
    def repoRoot = rootProject.projectDir
    def minifyScript = rootProject.file('scripts/minify-assets.mjs')
    def resourcesOutDir = layout.buildDirectory.dir('resources/main/META-INF/resources')
    inputs.file(minifyScript)
    doLast {
        def outDir = resourcesOutDir.get().asFile
        def pb = new ProcessBuilder(
                'sh',
                '-c',
                'if command -v node >/dev/null; then node "$1" "$2"; else echo "[minify-assets] node not found, skipping minification"; fi',
                'sh',
                minifyScript.absolutePath,
                outDir.absolutePath
        )
        pb.directory(repoRoot)
        pb.inheritIO()
        def exitCode = pb.start().waitFor()
        if (exitCode != 0) {
            throw new GradleException("Asset minification failed with exit code ${exitCode}")
        }
    }
}

// Keep Quarkus dev mode rooted at the repository so the IDE and Gradle task
// both load the ignored root .env file.
tasks.named('quarkusDev') {
    setWorkingDir(rootProject.projectDir.absolutePath)
}
